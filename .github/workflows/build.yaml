---
name: build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LD_LIBRARY_PATH: /usr/local/opt/curl/lib:$LD_LIBRARY_PATH
  PYCURL_SSL_LIBRARY: openssl
  GEN_DOC_DIR: html

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: almalinux-9
            shortcut: el9
            container-name: almalinux9
          - name: almalinux-10
            shortcut: el10
            container-name: almalinux10
          - name: centos-stream-9
            shortcut: el9s
            container-name: el9stream
          - name: centos-stream-10
            shortcut: el10s
            container-name: el10stream

    name: Build on ${{ matrix.name }}

    env:
      ARTIFACTS_DIR: exported-artifacts

    container:
      image: quay.io/ovirt/buildcontainer:${{ matrix.container-name }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Install required packages
        run: |
          dnf install -y \
            gcc \
            git \
            gzip \
            python3-devel \
            rpm-build \
            sed

      - name: Set build environment
        run: |
          TAG=$(git tag --points-at HEAD | head -1)
          if [[ -n "$TAG" ]]; then
            if [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
              echo "RPM_VERSION=${BASH_REMATCH[1]}" >> $GITHUB_ENV
              echo "PACKAGE_RPM_RELEASE=${BASH_REMATCH[2]}" >> $GITHUB_ENV
            elif [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "RPM_VERSION=${BASH_REMATCH[1]}" >> $GITHUB_ENV
              echo "PACKAGE_RPM_RELEASE=1" >> $GITHUB_ENV
            else
              echo "PACKAGE_RPM_RELEASE=1" >> $GITHUB_ENV
            fi
          else
            echo "RELEASE_SUFFIX=.$(date --utc +%Y%m%d%H%M%S).git$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      - name: Build RPM
        run: .automation/build-rpm.sh $ARTIFACTS_DIR

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.shortcut }}
          path: ${{ env.ARTIFACTS_DIR }}

  publish-rpms:
    permissions:
      artifact-metadata: read
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ovirt/ovirt-workflows/.github/workflows/publish-rpms.yml@main
    secrets: inherit

  generate_documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
      # This step installs dependencies for python-sdk and pdoc
        run: |
          sudo apt update &&
          sudo apt install -y git \
            python3 \
            python3-dev \
            curl \
            asciidoctor \
            gcc \
            libxml2-dev \
            libcurl4-openssl-dev \
            libexpat1-dev \
            gettext \
            libz-dev \
            libssl-dev \
            libgnutls28-dev

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Python-SDK with Python 3
        # This step installs the python-sdk with python2.7, as the extension of pdoc,
        # which is subsequently installed, doesn't have python3 support.
        run: |
          pip install setuptools
          bash .automation/generate-setup-files.sh
          python3 setup.py install --user --prefix=
        shell: bash

      - name: Install Pdoc
        # This steps installs an extension of pdoc which supports asciidoc
        # (this extension runs on python2).
        run: |
          pip install pdoc

      - name: Install pygments
        run: pip install pygments

      - name: Generate documentation
        run: pdoc ovirtsdk4 -o ./${{ env.GEN_DOC_DIR }} -t pdoc

      - name: Upload generated documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-documentation
          path: ${{ env.GEN_DOC_DIR }}/*

  publish-doc:
    permissions:
      contents: write
    needs: generate_documentation
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream9
    steps:
      - name: Download generated documentation artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-documentation
          path: ${{ env.GEN_DOC_DIR }}/

      - name: Install package dependencies
        run: |
          dnf install \
            git \
            python3-devel \
            python3-pip \
            -y

      - name: Set git defaults
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: ovirt-engine-sdk
          ref: 'gh-pages'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set FOLDER variable according to pushed branch
        run: |
          IFS="/" read _ type value <<<  ${GITHUB_REF}
          if [[ ${type} == "heads" ]];
          then
            if [[ ${value} == "main" ]]
            then
              echo "FOLDER=master" >> $GITHUB_ENV;
            else
              echo "FOLDER=${value: -3}" >> $GITHUB_ENV;
            fi
          elif [[ ${type} == "tags" ]]
          then
            echo "FOLDER=${value:0:3}" >> $GITHUB_ENV;
          fi

      - name: Move created documentation to gh-pages
        run: |
          mkdir -p ./ovirt-engine-sdk/${{ env.FOLDER }}/
          cp -r ./${{ env.GEN_DOC_DIR }}/* ./ovirt-engine-sdk/${{ env.FOLDER }}/

      - name: Push changes to gh-pages
        run: |
          cd ovirt-engine-sdk
          commit=$(git log --format="%H" -n 1)
          description=$(git describe --always)
          if git status --porcelain 2>/dev/null| grep -E "^??|^M"
          then
            git add .
            git commit -m "gh-pages ${description} ${commit}"
            git push
          fi
